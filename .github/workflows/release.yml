name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Prepare variables
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "binary=ipinfo-api" >> $GITHUB_OUTPUT

      - name: Create dist directory
        run: mkdir -p dist

      # -------------------------
      # Linux builds
      # -------------------------

      - name: Build linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-linux-amd64

      - name: Build linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-linux-arm64

      # -------------------------
      # macOS (Darwin) builds
      # -------------------------

      - name: Build darwin/arm64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-darwin-arm64

      # -------------------------
      # Checksums
      # -------------------------

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      # -------------------------
      # Release
      # -------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: Release ${{ steps.vars.outputs.version }}
          generate_release_notes: true
          files: |
            dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-linux-amd64
            dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-linux-arm64
            dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-darwin-arm64
            dist/checksums.txt
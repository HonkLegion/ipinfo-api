name: Release binaries and Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build, release, and publish Docker image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/{1}', secrets.DOCKERHUB_USERNAME, github.event.repository.name) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare variables
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "binary=ipinfo-api" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            echo "is_stable=true" >> $GITHUB_OUTPUT
          fi
          if [[ "$VERSION" == v0.* ]]; then
            echo "is_major_zero=true" >> $GITHUB_OUTPUT
          else
            echo "is_major_zero=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.vars.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.vars.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.vars.outputs.version }},enable=${{ steps.vars.outputs.is_stable == 'true' && steps.vars.outputs.is_major_zero != 'true' }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.is_stable == 'true' }}
            type=sha,prefix=sha-

      - name: Create dist directory
        run: mkdir -p dist

      # -------------------------
      # Linux builds
      # -------------------------

      - name: Build linux/amd64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-linux-amd64

      - name: Build linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-linux-arm64

      # -------------------------
      # macOS (Darwin) builds
      # -------------------------

      - name: Build darwin/arm64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
          go build -trimpath -ldflags="-s -w" \
          -o dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-darwin-arm64

      # -------------------------
      # Checksums
      # -------------------------

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}

      # -------------------------
      # Release
      # -------------------------

      - name: Check whether GitHub Release exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.vars.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GitHub Release for tag '${{ steps.vars.outputs.version }}' does not exist. Skipping asset upload."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to existing GitHub Release
        if: steps.release_check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.vars.outputs.version }}" \
            "dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-linux-amd64" \
            "dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-linux-arm64" \
            "dist/${{ steps.vars.outputs.binary }}-${{ steps.vars.outputs.version }}-darwin-arm64" \
            "dist/checksums.txt" \
            --clobber
